services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rocket}
      POSTGRES_USER: ${POSTGRES_USER:-rocket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rocket}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rocket}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-rocket}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-update}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      HOSTNAME: "0.0.0.0"
      API_INTERNAL_URL: "http://api:8000"
    depends_on:
      - api
    ports:
      - "3000:3000"

  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - api

  capture:
    build: ./capture
    # network_mode: host でホストの ADB サーバー (localhost:5037) と
    # API (localhost:8001) の両方に直接アクセス
    network_mode: host
    environment:
      CAPTURE_USERNAME: ${CAPTURE_USERNAME}
      CAPTURE_PASSWORD: ${CAPTURE_PASSWORD}
      API_BASE_URL: http://localhost:8001
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
